name: Build BiNeuron (Windows, Linux, macOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          $env:CMAKE_ARGS = "-DGGML_CUDA=off -DGGML_NATIVE=off -DGGML_BACKEND_DL=OFF"
          pip install llama-cpp-python --force-reinstall --no-cache-dir
          pip install flask pyinstaller pywebview

      - name: Verify critical imports
        shell: pwsh
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import transformers; print('transformers', transformers.__version__)"
          python -c "import llama_cpp; print('llama_cpp ok')"
          python -c "import webview; print('webview ok')"
          python -c "from all_logic_interface.app import app; print('app ok')"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
                      --windowed `
                      --name BiNeuron-Web-Windows `
                      --icon img_files/logo.ico `
                      --additional-hooks-dir=pyinstaller_hooks `
                      --runtime-hook pyinstaller_hooks/runtime_hook_llama.py `
                      --runtime-hook pyinstaller_hooks/runtime_hook_torch_cuda.py `
                      --collect-all numpy `
                      --collect-all llama_cpp `
                      --collect-all transformers `
                      --collect-all torch `
                      --collect-all webview `
                      --copy-metadata odfdo `
                      --copy-metadata transformers `
                      --copy-metadata torch `
                      --copy-metadata tokenizers `
                      --hidden-import numpy `
                      --hidden-import numpy.core._multiarray_umath `
                      --hidden-import numpy.core._multiarray_tests `
                      --hidden-import torch `
                      --hidden-import torch._C `
                      --hidden-import torch.backends.cudnn `
                      --hidden-import torch.cuda `
                      --hidden-import transformers `
                      --hidden-import tokenizers `
                      --hidden-import llama_cpp.llama_cpp `
                      --hidden-import fitz `
                      --hidden-import pymupdf `
                      --hidden-import docx `
                      --hidden-import pptx `
                      --hidden-import openpyxl `
                      --hidden-import lxml `
                      --hidden-import bs4 `
                      --hidden-import requests `
                      --hidden-import pydantic `
                      --hidden-import pydantic_core `
                      --hidden-import huggingface_hub `
                      --hidden-import easyocr `
                      --hidden-import deepseek_ocr `
                      --hidden-import markitdown `
                      --hidden-import argostranslate `
                      --hidden-import webview `
                      --hidden-import webview.platforms.edgechromium `
                      --hidden-import all_logic_interface.app `
                      --add-data "img_files;img_files" `
                      --add-data "all_logic_interface;all_logic_interface" `
                      --add-data "templates;templates" `
                      --add-data "static;static" `
                      launcher.py

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\BiNeuron-Web-Windows.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "App exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "App stayed alive for 15s - OK"

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-Web-Windows
          path: dist/BiNeuron-Web-Windows.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            python3-tk libgl1 libglib2.0-0 libgomp1 \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            libgirepository1.0-dev libcairo2-dev \
            xvfb dbus-x11

      - name: Install Python dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install torch torchvision \
              --index-url https://download.pytorch.org/whl/cpu \
              --force-reinstall --no-cache-dir
          CMAKE_ARGS="-DGGML_CUDA=off -DGGML_NATIVE=off -DGGML_BACKEND_DL=OFF" \
              pip install llama-cpp-python --force-reinstall --no-cache-dir
          pip install pygobject flask pyinstaller pywebview

      - name: Verify critical imports
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import transformers; print('transformers', transformers.__version__)"
          python -c "import llama_cpp; print('llama_cpp ok')"
          python -c "import webview; print('webview ok')"
          python -c "from all_logic_interface.app import app; print('app ok')"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile \
                      --windowed \
                      --name BiNeuron-Web-Linux \
                      --additional-hooks-dir=pyinstaller_hooks \
                      --runtime-hook pyinstaller_hooks/runtime_hook_llama.py \
                      --runtime-hook pyinstaller_hooks/runtime_hook_torch_cuda.py \
                      --collect-all numpy \
                      --collect-all llama_cpp \
                      --collect-all transformers \
                      --collect-all torch \
                      --collect-all webview \
                      --copy-metadata odfdo \
                      --copy-metadata transformers \
                      --copy-metadata torch \
                      --copy-metadata tokenizers \
                      --hidden-import numpy \
                      --hidden-import numpy.core._multiarray_umath \
                      --hidden-import numpy.core._multiarray_tests \
                      --hidden-import torch \
                      --hidden-import torch._C \
                      --hidden-import torch.backends.cudnn \
                      --hidden-import torch.cuda \
                      --hidden-import transformers \
                      --hidden-import tokenizers \
                      --hidden-import llama_cpp.llama_cpp \
                      --hidden-import fitz \
                      --hidden-import pymupdf \
                      --hidden-import docx \
                      --hidden-import pptx \
                      --hidden-import openpyxl \
                      --hidden-import lxml \
                      --hidden-import bs4 \
                      --hidden-import requests \
                      --hidden-import pydantic \
                      --hidden-import pydantic_core \
                      --hidden-import huggingface_hub \
                      --hidden-import easyocr \
                      --hidden-import deepseek_ocr \
                      --hidden-import markitdown \
                      --hidden-import argostranslate \
                      --hidden-import webview \
                      --hidden-import webview.platforms.gtk \
                      --hidden-import gi \
                      --hidden-import gi.repository.Gtk \
                      --hidden-import gi.repository.WebKit2 \
                      --hidden-import all_logic_interface.app \
                      --exclude-module torch.distributed \
                      --exclude-module torch.testing \
                      --exclude-module triton \
                      --exclude-module nvidia \
                      --exclude-module IPython \
                      --exclude-module jupyter \
                      --exclude-module notebook \
                      --exclude-module pytest \
                      --exclude-module sphinx \
                      --exclude-module tensorboard \
                      --add-data "img_files:img_files" \
                      --add-data "all_logic_interface:all_logic_interface" \
                      --add-data "templates:templates" \
                      --add-data "static:static" \
                      launcher.py

      - name: Smoke test (xvfb)
        shell: bash
        run: |
          timeout --signal=TERM 15 xvfb-run -a --server-args="-screen 0 1400x900x24" \
              ./dist/BiNeuron-Web-Linux > out.log 2>&1
          RC=$?
          echo "----- OUTPUT -----"
          cat out.log || true
          if [ $RC -eq 124 ] || [ $RC -eq 143 ]; then
            echo "App stayed alive for 15s - OK"
          else
            echo "::error::App crashed with exit code $RC"
            exit 1
          fi

      - name: Create .desktop file
        run: |
          cat > BiNeuron-Web.desktop <<EOF
          [Desktop Entry]
          Name=BiNeuron
          Exec=$PWD/dist/BiNeuron-Web-Linux
          Icon=$PWD/img_files/logo.ico
          Type=Application
          Categories=Utility;
          Terminal=false;
          EOF

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-Web-Linux
          path: |
            dist/BiNeuron-Web-Linux
            BiNeuron-Web.desktop
            img_files/logo.ico
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew update --quiet || true
          brew install tcl-tk imagemagick cmake ninja pkg-config

      - name: Convert .ico to .icns
        run: |
          convert img_files/logo.ico img_files/logo.png
          rm -rf logo.iconset
          mkdir -p logo.iconset
          sips -z 16    16    img_files/logo.png --out logo.iconset/icon_16x16.png
          sips -z 32    32    img_files/logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32    32    img_files/logo.png --out logo.iconset/icon_32x32.png
          sips -z 64    64    img_files/logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128   128   img_files/logo.png --out logo.iconset/icon_128x128.png
          sips -z 256   256   img_files/logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256   256   img_files/logo.png --out logo.iconset/icon_256x256.png
          sips -z 512   512   img_files/logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512   512   img_files/logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024  1024  img_files/logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o img_files/logo.icns

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          CMAKE_ARGS="-DGGML_METAL=on -DGGML_NATIVE=off" \
              pip install llama-cpp-python --force-reinstall --no-cache-dir
          pip install flask pyinstaller pywebview

      - name: Verify critical imports
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import transformers; print('transformers', transformers.__version__)"
          python -c "import llama_cpp; print('llama_cpp ok')"
          python -c "import webview; print('webview ok')"
          python -c "from all_logic_interface.app import app; print('app ok')"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile \
                      --windowed \
                      --name BiNeuron-Web-MacOS \
                      --icon img_files/logo.icns \
                      --additional-hooks-dir=pyinstaller_hooks \
                      --runtime-hook pyinstaller_hooks/runtime_hook_llama.py \
                      --runtime-hook pyinstaller_hooks/runtime_hook_torch_cuda.py \
                      --collect-all numpy \
                      --collect-all llama_cpp \
                      --collect-all transformers \
                      --collect-all torch \
                      --collect-all webview \
                      --copy-metadata odfdo \
                      --copy-metadata transformers \
                      --copy-metadata torch \
                      --copy-metadata tokenizers \
                      --hidden-import numpy \
                      --hidden-import numpy.core._multiarray_umath \
                      --hidden-import numpy.core._multiarray_tests \
                      --hidden-import torch \
                      --hidden-import torch._C \
                      --hidden-import torch.backends.cudnn \
                      --hidden-import torch.cuda \
                      --hidden-import transformers \
                      --hidden-import tokenizers \
                      --hidden-import llama_cpp.llama_cpp \
                      --hidden-import fitz \
                      --hidden-import pymupdf \
                      --hidden-import docx \
                      --hidden-import pptx \
                      --hidden-import openpyxl \
                      --hidden-import lxml \
                      --hidden-import bs4 \
                      --hidden-import requests \
                      --hidden-import pydantic \
                      --hidden-import pydantic_core \
                      --hidden-import huggingface_hub \
                      --hidden-import easyocr \
                      --hidden-import deepseek_ocr \
                      --hidden-import markitdown \
                      --hidden-import argostranslate \
                      --hidden-import webview \
                      --hidden-import webview.platforms.cocoa \
                      --hidden-import all_logic_interface.app \
                      --add-data "img_files:img_files" \
                      --add-data "all_logic_interface:all_logic_interface" \
                      --add-data "templates:templates" \
                      --add-data "static:static" \
                      launcher.py

      - name: Smoke test
        shell: bash
        run: |
          timeout --signal=TERM 15 ./dist/BiNeuron-Web-MacOS.app/Contents/MacOS/BiNeuron-Web-MacOS > out.log 2>&1
          RC=$?
          echo "----- OUTPUT -----"
          cat out.log || true
          if [ $RC -eq 124 ] || [ $RC -eq 143 ]; then
            echo "App stayed alive for 15s - OK"
          else
            echo "::error::App crashed with exit code $RC"
            exit 1
          fi

      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-Web-MacOS
          path: dist/BiNeuron-Web-MacOS.app
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create ZIP archives
        run: |
          cd artifacts
          zip -r BiNeuron-Web-Windows.zip BiNeuron-Web-Windows/
          zip -r BiNeuron-Web-Linux.zip  BiNeuron-Web-Linux/
          zip -r BiNeuron-Web-MacOS.zip  BiNeuron-Web-MacOS/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/BiNeuron-Web-Windows.zip
            artifacts/BiNeuron-Web-Linux.zip
            artifacts/BiNeuron-Web-MacOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}