name: Build BiNeuron (Windows, Linux, macOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onefile)
        run: |
          pyinstaller --onefile `
                      --windowed `
                      --name BiNeuron-Windows `
                      --icon img_files/logo.ico `
                      --add-data "img_files;img_files" `
                      --add-data "BiNeuron;BiNeuron" `
                      gui.py

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-Windows
          path: dist/BiNeuron-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (Tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onefile) - optimized
        run: |
          pyinstaller --onefile \
                      --windowed \
                      --strip \
                      --name BiNeuron-Linux \
                      --exclude-module torch.cuda \
                      --exclude-module triton \
                      --exclude-module nvidia \
                      --exclude-module torch.distributed \
                      --exclude-module torch.testing \
                      --add-data "img_files:img_files" \
                      --add-data "BiNeuron:BiNeuron" \
                      gui.py

      - name: Create .desktop file for Linux
        run: |
          cat > BiNeuron.desktop <<EOF
          [Desktop Entry]
          Name=BiNeuron
          Exec=$PWD/dist/BiNeuron-Linux
          Icon=$PWD/img_files/logo.ico
          Type=Application
          Categories=Utility;
          EOF

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-Linux
          path: |
            dist/BiNeuron-Linux
            BiNeuron.desktop
            img_files/logo.ico

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (Tkinter + ImageMagick for icon conversion)
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install tcl-tk imagemagick

      - name: Convert .ico to .icns for macOS
        run: |
          convert img_files/logo.ico img_files/logo.png
          mkdir logo.iconset
          sips -z 16 16     img_files/logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32     img_files/logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32     img_files/logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64     img_files/logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128   img_files/logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256   img_files/logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256   img_files/logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512   img_files/logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512   img_files/logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 img_files/logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o img_files/logo.icns

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onefile)
        run: |
          pyinstaller --onefile \
                      --windowed \
                      --name BiNeuron-MacOS \
                      --icon img_files/logo.icns \
                      --add-data "img_files:img_files" \
                      --add-data "BiNeuron:BiNeuron" \
                      gui.py

      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-MacOS
          path: dist/BiNeuron-MacOS

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create ZIP archives for each platform
        run: |
          cd artifacts
          zip -r BiNeuron-Windows.zip BiNeuron-Windows/
          zip -r BiNeuron-Linux.zip BiNeuron-Linux/
          zip -r BiNeuron-MacOS.zip BiNeuron-MacOS/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/BiNeuron-Windows.zip
            artifacts/BiNeuron-Linux.zip
            artifacts/BiNeuron-MacOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}