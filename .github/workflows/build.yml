name: Build BiNeuron (Linux & macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onefile)
        run: |
          pyinstaller --onefile \
                      --windowed \
                      --name BiNeuron-Linux \
                      --add-data "img_files:img_files" \
                      --add-data "BiNeuron:BiNeuron" \
                      gui.py

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-Linux
          path: dist/BiNeuron-Linux

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Tkinter)
        run: |
          brew install tcl-tk
          echo "export PATH=/usr/local/opt/tcl-tk/bin:$PATH" >> ~/.zshrc
          echo "export LDFLAGS=-L/usr/local/opt/tcl-tk/lib" >> ~/.zshrc
          echo "export CPPFLAGS=-I/usr/local/opt/tcl-tk/include" >> ~/.zshrc
          source ~/.zshrc

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onefile)
        run: |
          pyinstaller --onefile \
                      --windowed \
                      --name BiNeuron-MacOS \
                      --add-data "img_files:img_files" \
                      --add-data "BiNeuron:BiNeuron" \
                      gui.py

      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-MacOS
          path: dist/BiNeuron-MacOS
