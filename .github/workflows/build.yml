name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name BiNeuron --add-data "img_files;img_files" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-windows
          path: dist/BiNeuron.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-glx libsm6 libxrender1 libxext6 fontconfig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name BiNeuron --add-data "img_files:img_files" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-linux
          path: dist/BiNeuron

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name BiNeuron --add-data "img_files:img_files" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiNeuron-macos
          path: dist/BiNeuron.app

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/BiNeuron-windows/BiNeuron.exe
            artifacts/BiNeuron-linux/BiNeuron
            artifacts/BiNeuron-macos/BiNeuron.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}